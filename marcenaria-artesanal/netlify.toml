# netlify.toml — Vite + Vue (SPA)

[build]
  command = "npm run build"
  publish = "dist"
  # Se for usar funções no futuro, descomente a linha abaixo e crie a pasta:
  # functions = "netlify/functions"

# SPA fallback (Vue Router em modo history)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Fixar Node 20 no build
[context.production.environment]
  NODE_VERSION = "20"