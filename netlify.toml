# netlify.toml — Vite + Vue (SPA) com app em subpasta

[build]
  base = "marcenaria-artesanal"   # <- a subpasta onde está seu package.json
  command = "npm run build"
  publish = "dist"
  # functions = "netlify/functions"  # deixe comentado se não usa

# SPA fallback (Vue Router - history mode)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  NODE_VERSION = "20"